<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PampGram — Модификация Telegram для iOS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #090a10;
      --surface: #11131c;
      --surface-border: #1e2233;
      --surface-hover: #171a26;
      --text-main: #f1f5f9;
      --text-muted: #838ca3;
      --accent: #38bdf8;
      --accent-purple: #818cf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
      position: relative;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      pointer-events: none;
      z-index: -1;
    }

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--accent-gradient);
      z-index: 2000;
      transition: width 0.1s ease-out;
    }

    /* Верхняя навигация */
    .header {
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(9, 10, 16, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface-border);
    }

    .nav-container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.4px;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1rem;
    }

    .nav-center {
      display: none;
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 1.6rem;
    }

    .nav-link {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: var(--text-main);
      color: #000;
      padding: 0.55rem 1.1rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.84rem;
      white-space: nowrap;
      transition: var(--transition);
      cursor: pointer;
      border: none;
    }

    .nav-btn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .mobile-menu-toggle {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.35rem;
      cursor: pointer;
      display: block;
    }

    .mobile-menu-drawer {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: rgba(9, 10, 16, 0.98);
      border-bottom: 1px solid var(--surface-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1.25rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .mobile-menu-drawer.active {
      display: flex;
    }

    /* Главный экран */
    .hero {
      max-width: 900px;
      margin: 0 auto;
      padding: 4.5rem 1.25rem 3.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-app-icon {
      width: 110px;
      height: 110px;
      border-radius: 26px;
      background: var(--surface);
      border: 1.5px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.8rem;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
    }

    .hero-app-icon img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .hero-title {
      font-size: clamp(2.3rem, 5.5vw, 3.9rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 1.2rem;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto 2.5rem;
    }

    .hero-actions {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.9rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 3.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      white-space: nowrap;
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--text-main);
      color: #000;
    }

    .btn-primary:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    /* Таблица сравнения (Оригинал слева, PampGram справа) */
    .compare-section {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 4rem;
    }

    .compare-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .compare-header-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      padding: 1.2rem 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--surface-border);
      font-weight: 800;
      font-size: 0.95rem;
      align-items: center;
    }

    .col-title {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .col-center {
      text-align: center;
    }

    .col-highlight {
      color: var(--accent);
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .compare-item-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      padding: 1.05rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      align-items: center;
      transition: var(--transition);
    }

    .compare-item-row:last-child {
      border-bottom: none;
    }

    .compare-item-row:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .feature-name {
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .feature-name i {
      color: var(--accent);
      font-size: 0.85rem;
    }

    .badge-no {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge-yes {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Симулятор твиков */
    .simulator-section {
      max-width: 960px;
      margin: 0 auto 5rem;
      padding: 0 1.25rem;
    }

    .simulator-box {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 1.8rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.8rem;
    }

    @media (min-width: 768px) {
      .simulator-box {
        grid-template-columns: 1.1fr 1fr;
        align-items: center;
      }
    }

    .sim-controls {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .sim-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--surface-border);
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }

    .sim-toggle.active {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.06);
    }

    .sim-toggle-left {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .sim-toggle-title {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .sim-toggle-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .sim-switch {
      width: 36px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      position: relative;
      transition: var(--transition);
    }

    .sim-switch::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: var(--transition);
    }

    .sim-toggle.active .sim-switch {
      background: var(--accent);
    }

    .sim-toggle.active .sim-switch::after {
      left: 18px;
    }

    .sim-screen {
      background: #090a12;
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      font-size: 0.85rem;
    }

    .sim-bubble {
      padding: 0.65rem 0.95rem;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.45;
    }

    .sim-bubble-in {
      background: #181b28;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .sim-bubble-out {
      background: #0284c7;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .sim-ad-post {
      background: rgba(234, 179, 8, 0.08);
      border: 1px dashed rgba(234, 179, 8, 0.35);
      color: #facc15;
      padding: 0.7rem;
      border-radius: 10px;
      text-align: center;
      font-size: 0.8rem;
      transition: var(--transition);
    }

    .sim-ad-post.hidden {
      display: none;
    }

    /* Возможности */
    .features-section {
      max-width: 960px;
      margin: 0 auto 5rem;
      padding: 0 1.25rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .section-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.6rem;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 0.96rem;
      max-width: 540px;
      margin: 0 auto;
    }

    .features-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 1.6rem;
      transition: var(--transition);
      display: flex;
      gap: 1.1rem;
      align-items: flex-start;
    }

    .card:hover {
      border-color: #2f364f;
      transform: translateY(-2px);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #171b29;
      border: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .card-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* Чеклист готовности (без VPN) */
    .checklist-section {
      max-width: 960px;
      margin: 0 auto 5rem;
      padding: 0 1.25rem;
    }

    .checklist-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      padding: 1.8rem 1.6rem;
    }

    .check-progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
      margin: 1.2rem 0 1.6rem;
    }

    .check-progress-fill {
      height: 100%;
      width: 66%;
      background: var(--accent-gradient);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--surface-border);
      padding: 0.85rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }

    .check-item.done {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.05);
    }

    .check-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .check-box-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: transparent;
      transition: var(--transition);
    }

    .check-item.done .check-box-icon {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .check-tag {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* Методы установки */
    .methods-section {
      max-width: 960px;
      margin: 0 auto 5rem;
      padding: 0 1.25rem;
    }

    .methods-grid {
